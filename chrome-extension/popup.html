<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Same three-way Popup theme setting the translation popup uses — this
       panel follows it too, so picking Dark doesn't leave a white sheet of
       settings behind the dark popup. 'auto' is resolved to one of the two
       classes in popup.js (matchMedia), never with a media query here. */
    :root {
      --bg: #faf6ef;
      --fg: #2a2520;
      --muted: #5a544c;
      --field: #ffffff;
      --line: rgba(0,0,0,0.1);
      --line-soft: rgba(0,0,0,0.06);
      --hover: rgba(0,0,0,0.03);
      --danger: #b3261e;
      --btn-bg: #2a2520;
      --btn-fg: #faf6ef;
    }
    /* color-scheme so the native range thumb, the select menu and the
       password reveal render dark too — CSS variables can't reach those. */
    body.theme-dark {
      color-scheme: dark;
      --bg: #22201d;
      --fg: #e8e3da;
      --muted: #9a938a;
      --field: #2c2a26;
      --line: rgba(255,255,255,0.14);
      --line-soft: rgba(255,255,255,0.08);
      --hover: rgba(255,255,255,0.06);
      --danger: #ef8a7e;
      --btn-bg: #e8e3da;
      --btn-fg: #22201d;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--fg);
    }
    h2 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
    }
    .setting {
      margin-bottom: 16px;
    }
    .setting-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      color: var(--fg);
      font-size: 13px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      box-shadow: none;
    }
    input[type="range"] {
      padding: 0;
    }
    .value-display {
      float: right;
      font-variant-numeric: tabular-nums;
    }
    .help-text {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.4;
    }
    /* ---- Model list: one row per model, click to select, x to remove ---- */
    .model-list {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--field);
      overflow: hidden;
    }
    .model-row {
      display: flex;
      align-items: center;
      border-top: 1px solid var(--line-soft);
    }
    .model-row:first-child { border-top: 0; }
    .model-pick {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 8px;
      border: 0;
      background: none;
      font: inherit;
      font-size: 13px;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .model-pick:hover { background: var(--hover); }
    /* A fixed-width tick gutter, so the names line up whether or not the
       row is the selected one. */
    .model-pick::before {
      content: "\2713";
      width: 12px;
      flex: none;
      visibility: hidden;
    }
    .model-pick.selected::before { visibility: visible; }
    .model-pick.selected { font-weight: 600; }
    .model-pick .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-pick .tag {
      flex: none;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .model-del {
      width: 28px;
      flex: none;
      padding: 8px 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .model-del:hover { color: var(--danger); }
    .model-empty {
      padding: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    /* ---- Add-model form ---- */
    details.add-model { margin-top: 8px; }
    details.add-model > summary {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      list-style: none;
      padding: 2px 0;
    }
    details.add-model > summary::-webkit-details-marker { display: none; }
    details.add-model > summary::before { content: "+ "; }
    .add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .add-form .full { grid-column: 1 / -1; }
    .add-form label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .add-btn {
      grid-column: 1 / -1;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .form-error {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 11px;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <h2>Translator Settings</h2>
  
  <!-- One flat, fully editable model list: pick one with its row, drop one
       with the x, add your own below by the id its provider knows it by.
       Reasoning picks the reasoning_effort a Groq model accepts — "off"
       omits the parameter, which is what llama/gemma/mixtral need. -->
  <div class="setting">
    <label class="setting-label">Model</label>
    <div class="model-list" id="model-list"></div>
    <details class="add-model" id="add-model">
      <summary>Add model</summary>
      <div class="add-form">
        <div class="full">
          <label for="nm-model">Model ID</label>
          <input id="nm-model" placeholder="provider/model" spellcheck="false">
        </div>
        <div>
          <label for="nm-provider">Provider</label>
          <select id="nm-provider"></select>
        </div>
        <div>
          <label for="nm-reasoning">Reasoning</label>
          <select id="nm-reasoning"></select>
        </div>
        <p class="form-error" id="nm-error" hidden></p>
        <button type="button" class="add-btn" id="nm-add">Add model</button>
      </div>
    </details>
  </div>

  <div class="setting">
    <label class="setting-label">
      Context length
      <span class="value-display" id="context-val">1</span>
    </label>
    <input type="range" id="context-range" min="0" max="10" step="1">
    <div class="help-text">Surrounding sentences to include for context.</div>
  </div>

  <div class="setting">
    <label class="setting-label">
      Word spacing
      <span class="value-display" id="word-spacing-val">0px</span>
    </label>
    <input type="range" id="word-spacing-range" min="-2" max="20" step="0.5">
    <div class="help-text">Extra space between words in the translation popup.</div>
  </div>

  <div class="setting">
    <label class="setting-label" for="theme-select">Popup theme</label>
    <select id="theme-select">
      <option value="auto">Auto — follow the system</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <div class="help-text">Colors of the translation popup, on every page.</div>
  </div>

  <div class="setting">
    <label class="setting-label">Groq API Key</label>
    <input type="password" id="key-groq" placeholder="Paste your Groq API key">
  </div>

  <div class="setting">
    <label class="setting-label">Gemini API Key</label>
    <input type="password" id="key-gemini" placeholder="Paste your Gemini API key">
  </div>

  <script src="js/models.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
